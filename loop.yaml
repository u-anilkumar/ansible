- name: testing loops
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: installing multiple pacakages
    ansible.builtin.package:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
    loop:
    - {name: "mysql", state: "present"}
    - {name: "mysql", state: "absent"}
    - {name: "nginx", state: "present"}
    when: item.name == "nginx"
    register: user_output
  - name: printing user oput.
    ansible.builtin.debug:
     msg: "{{ user_output }}"
